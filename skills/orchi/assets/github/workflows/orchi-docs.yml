name: Orchi documentation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check local documentation links
        run: python3 .agents/skills/orchi/scripts/knowledge.py lint
      - name: Check the Documentation impact section
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .agents/skills/orchi/scripts/knowledge.py impact
