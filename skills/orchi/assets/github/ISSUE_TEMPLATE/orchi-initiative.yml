name: Orchi Initiative
description: A request decomposed into Epics on an initiative branch.
title: "[INITIATIVE][KEY] "
labels: [Initiative]
body:
  - type: markdown
    attributes:
      value: "Replace KEY with 2-6 uppercase letters that no other issue title uses, for example [INITIATIVE][PAY] Card payments."
  - type: textarea
    id: request
    attributes:
      label: Original request
      description: The request as agreed with the requester, kept distinct from later decisions.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Agreed outcome
      description: Observable result and explicit exclusions.
    validations:
      required: true
  - type: input
    id: plan
    attributes:
      label: Plan
      description: Link to docs/initiatives/<key>-<slug>/README.md on the initiative/<key>-<slug> branch.
