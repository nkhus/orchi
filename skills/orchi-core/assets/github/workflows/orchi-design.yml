name: Orchi design check

on:
  pull_request:

permissions:
  contents: read

jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect design anti-patterns in changed UI files with Impeccable
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DO_NOT_TRACK: "1"
        run: |
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- \
            '*.html' '*.css' '*.scss' '*.sass' '*.less' '*.jsx' '*.tsx' '*.vue' '*.svelte' '*.astro')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed UI files."
            exit 0
          fi
          npx --yes impeccable@4.8.0 detect --github "${files[@]}"
