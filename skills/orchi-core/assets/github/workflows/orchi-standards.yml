name: Orchi standards

on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that every check ENGINEERING.md declares runs in CI
        run: python3 .claude/skills/orchi-core/scripts/standards.py check

  drift:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep one Issue that lists what drifted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          findings=$(python3 .claude/skills/orchi-core/scripts/standards.py check 2>&1) || status=$?
          echo "$findings"
          [ "$status" -eq 0 ] && exit 0
          title="Standards drift"
          number=$(gh issue list --state open --label needs-planning --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          body=$(printf 'The weekly `standards.py check` found:\n\n```\n%s\n```\n\nPlan this like any request.\n' "$findings")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$title" --label needs-planning --body "$body"
          fi
